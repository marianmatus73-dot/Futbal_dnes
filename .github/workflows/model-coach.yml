name: Weekly Model Coach

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build advisory model review
        run: python -m scripts.run_model_governance
      - name: Commit advisory report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/model_governance.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly model coach [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
