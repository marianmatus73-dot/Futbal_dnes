name: Multisport Learning V2

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python scripts/run_multisport_learning_v2.py --database bets.db

      - uses: actions/upload-artifact@v4
        with:
          name: multisport-learning-v2
          path: |
            exports/multisport_learning_v2_report.json
            exports/multisport_learning_v2_metrics.csv
            exports/multisport_learning_v2_dashboard.html
