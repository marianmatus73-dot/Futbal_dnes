name: Sportmonks Context Test

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of upcoming days to test (1-7)"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "7"]

jobs:
  test-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify secret is configured
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          if [ -z "$SPORTMONKS_API_TOKEN" ]; then
            echo "::error::SPORTMONKS_API_TOKEN is missing"
            exit 1
          fi
      - name: Run unit tests
        run: python -m unittest tests.test_sportmonks -v
      - name: Test Sportmonks connection safely
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          DB_FILE: sportmonks_test.db
          HTTP_TIMEOUT: "30"
        run: python -m scripts.sync_sportmonks_context --days "${{ inputs.days }}"
      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportmonks-context-test-${{ github.run_number }}
          if-no-files-found: warn
          path: exports/sportmonks_sync_summary.json

