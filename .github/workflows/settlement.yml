name: Settlement Recovery

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "25 */4 * * *"

concurrency:
  group: production-history-writer
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements_v10.txt

      - name: Settle open results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          DB_FILE: bets.db
          EXPORT_DIR: exports
          GITHUB_ACTIONS: "1"
          SETTLEMENT_DIAGNOSTICS_ENABLED: "1"
          UNRESOLVED_EXPIRY_DAYS: "4"
          LOCAL_TZ: Europe/Bratislava
        run: python -m scripts.run_settlement_cycle

      - name: Upload settlement diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-recovery-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            exports/*settlement*.json
            exports/history_*.csv

      - name: Persist settlement history
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/history_*.csv exports/*settlement*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No settlement changes"
          else
            git commit -m "Settlement recovery update [skip ci]"
            # The settlement cycle also changes the local SQLite database and
            # may refresh non-persistent helper exports. Keep those runner-only
            # files out of the commit while allowing the history commit to
            # rebase safely when main moved during this job.
            git status --short
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
