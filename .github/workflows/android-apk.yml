name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Generate clean Android project
        working-directory: mobile
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p mobile/apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/apk/FutbalDnes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutbalDnes-Android-APK
          path: mobile/apk/FutbalDnes.apk
          if-no-files-found: error
          retention-days: 30
