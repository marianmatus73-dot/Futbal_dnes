name: Multisport Betting Engine

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - football
          - tennis
          - basketball
          - hockey
          - baseball
          - mma
          - nfl
      dry_run:
        description: "Run without production actions"
        required: true
        default: false
        type: boolean
      send_email:
        description: "Send email report"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "0 6,16 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify project structure
        shell: bash
        run: |
          set -e
          test -f main.py || { echo "::error::main.py is missing"; exit 1; }
          test -d core || { echo "::error::core/ directory is missing"; exit 1; }
          test -d sports || { echo "::error::sports/ directory is missing"; exit 1; }
          test -f core/multisport_learning/manager.py || {
            echo "::error::core/multisport_learning/manager.py is missing";
            exit 1;
          }
          test -f v16_main_hook.py || { echo "::error::v16_main_hook.py is missing"; exit 1; }
          test -f v16_16_profile_pipeline.py || {
            echo "::error::v16_16_profile_pipeline.py is missing";
            exit 1;
          }
          python -m py_compile main.py
          echo "Project structure OK"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip

          if [ -f requirements_v10.txt ]; then
            pip install -r requirements_v10.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements file missing"
            exit 1
          fi

      - name: Create directories
        run: |
          mkdir -p cache
          mkdir -p exports

      - name: Run engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}

          AKTUALNY_BANK: ${{ secrets.AKTUALNY_BANK }}
          BANKROLL: ${{ secrets.AKTUALNY_BANK }}
          DB_FILE: "bets.db"

          SPORT_MODE: "all"
          SPORT_CONCURRENCY: "5"
          SPORT_KEY_AUTO_DISCOVERY: "1"
          SPORTMONKS_SYNC_ENABLED: "1"
          SPORTMONKS_INCLUDE_XG: "0"
          SPORT_CONTEXT_MAX_AGE_HOURS: "24"

          MIN_EDGE: "0.06"
          MAX_EDGE: "0.18"
          MIN_PROB: "0.20"
          MAX_ODDS: "4.50"

          KELLY_FRAC: "0.0075"
          MAX_STAKE_PCT: "0.005"
          KELLY_FRACTION: "0.25"
          MAX_STAKE_PERCENT: "0.03"
          MIN_STAKE: "1"

          TOP_N_REPORT: "3"
          TOP_TIPS_LIMIT: "5"
          MIN_CONFIDENCE: "65"
          MAX_BETS_PER_DAY: "3"

          CONSENSUS_ENABLED: "1"
          ELO_WEIGHT: "0.25"
          XG_WEIGHT: "0.25"
          FORM_WEIGHT: "0.20"
          MARKET_WEIGHT: "0.20"
          CONTEXT_WEIGHT: "0.10"

          LEARNING_ENABLED: "1"
          LEARNING_MIN_SAMPLES: "20"
          LEARNING_RETRAIN_AFTER_SCAN: "1"

          V16_INTEGRATED_CYCLE_ENABLED: "1"
          V16_LEAGUE_PROFILE_ENABLED: "1"
          V16_PRODUCTION_MONITORING_ENABLED: "1"
          MULTISPORT_LEARNING_BUNDLE_ENABLED: "1"

          EXPORT_DIR: "exports"
          CACHE_DIR: "cache"

          CACHE_TTL_SECONDS: "3600"
          HTTP_TIMEOUT: "30"
          LOOKAHEAD_HOURS: "168"

          LOCAL_TZ: "Europe/Bratislava"
          LOG_LEVEL: "INFO"
          GITHUB_ACTIONS: "1"
        shell: bash
        run: |
          set -e

          EVENT_NAME="${{ github.event_name }}"
          SPORT_INPUT="${{ github.event.inputs.sport }}"
          DRY_RUN_INPUT="${{ github.event.inputs.dry_run }}"
          SEND_EMAIL_INPUT="${{ github.event.inputs.send_email }}"

          if [ -z "$SPORT_INPUT" ]; then
            SPORT_INPUT="all"
          fi

          ARGS=(--sport "$SPORT_INPUT")

          # Dry-run applies only to manual workflow_dispatch runs.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          # Scheduled runs must send email by default.
          # Add --no-email only when a manual run explicitly sets send_email=false.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SEND_EMAIL_INPUT" = "false" ]; then
            ARGS+=(--no-email)
          fi

          echo "Event: $EVENT_NAME"
          echo "Sport: $SPORT_INPUT"
          echo "Dry run input: ${DRY_RUN_INPUT:-n/a}"
          echo "Send email input: ${SEND_EMAIL_INPUT:-scheduled-default=true}"
          echo "Command: python main.py ${ARGS[*]}"

          python main.py "${ARGS[@]}"

      - name: Validate production tip card
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          set -e
          python -m scripts.validate_tip_card exports/latest_tip_card.json --max-age-minutes 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multisport-engine-reports-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            exports/
            bets.db

      - name: Commit exports
        if: success()
        shell: bash
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git rm --cached bets.db 2>/dev/null || true
          git rm --cached bets.db-wal 2>/dev/null || true
          git rm --cached bets.db-shm 2>/dev/null || true

          git add exports/*.csv exports/*.json exports/*.txt exports/*.html 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Multisport update [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

